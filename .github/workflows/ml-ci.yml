
name: Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Verify required application files
        run: |
          set -e
          test -f app.py
          test -f student_result_model.pkl
          test -f metrics.json
          test -f requirements.txt
          test -f Dockerfile
          test -f .dockerignore
          test -f test_app.py
          echo "All required files are present."

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          set -e

          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:5000/; then
              echo
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          set -e

          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"

          echo "$response" | python -c '
          import json
          import sys

          data = json.load(sys.stdin)

          assert "prediction" in data, "Missing prediction field"
          assert "prediction_code" in data, "Missing prediction_code field"
          assert data["prediction"] == "PASS", "Expected PASS prediction"
          assert data["prediction_code"] == 1, "Expected prediction_code 1"

          print("Prediction endpoint test passed.")
          '

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true

      - name: Prepare release candidate
        run: |
          set -e

          mkdir -p release_candidate

          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf '%s\n' \
            "Student Result Prediction ML Application" \
            "Run: python app.py" \
            "Health endpoint: GET /" \
            "Prediction endpoint: POST /predict" \
            > release_candidate/DEPLOYMENT.txt

          echo "Release candidate files:"
          ls -la release_candidate/

          test "$(find release_candidate -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
