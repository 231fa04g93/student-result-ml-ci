
name: Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Verify Docker configuration files
        run: |
          test -f Dockerfile || {
            echo "ERROR: Dockerfile is missing"
            exit 1
          }
          test -f .dockerignore || {
            echo "ERROR: .dockerignore is missing"
            exit 1
          }
          echo "Docker configuration files are present."

      - name: Run prediction application tests
        run: |
          if [ -f test_app.py ]; then
            python -m pytest -v test_app.py
          else
            echo "ERROR: test_app.py is missing"
            exit 1
          fi

      # Step 5: Build the Docker image
      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .
