
name: Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Verify Docker configuration files
        run: |
          test -f Dockerfile || {
            echo "ERROR: Dockerfile is missing"
            exit 1
          }

          test -f .dockerignore || {
            echo "ERROR: .dockerignore is missing"
            exit 1
          }

          test -f app.py || {
            echo "ERROR: app.py is missing"
            exit 1
          }

          test -f student_result_model.pkl || {
            echo "ERROR: Trained model is missing"
            exit 1
          }

          test -f metrics.json || {
            echo "ERROR: metrics.json is missing"
            exit 1
          }

          echo "All required Docker build files are present."

      - name: Run prediction application tests
        run: |
          if [ -f test_app.py ]; then
            python -m pip install pytest
            python -m pytest -v test_app.py
          else
            echo "WARNING: test_app.py is missing; application tests are skipped."
          fi

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent --show-error \
              http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"

          echo "$response" | python -c \
            'import json,sys; d=json.load(sys.stdin); assert "prediction" in d, "Missing prediction field"; assert "prediction_code" in d, "Missing prediction_code field"; print("Prediction response validated.")'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true

      - name: Prepare release candidate
        run: |
          set -e
          mkdir -p release_candidate

          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/

          printf "Student Result Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" \
            > release_candidate/DEPLOYMENT.txt

          echo "Release candidate files:"
          ls -la release_candidate/

          test -f release_candidate/Dockerfile
          test -f release_candidate/.dockerignore
          test "$(find release_candidate -maxdepth 1 -type f | wc -l)" -eq 7

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
