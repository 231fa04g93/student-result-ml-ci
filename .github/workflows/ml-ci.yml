
name: Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Verify required application files
        run: |
          set -e
          test -f app.py
          test -f student_result_model.pkl
          test -f metrics.json
          test -f requirements.txt
          test -f Dockerfile
          test -f .dockerignore
          test -f test_app.py
          echo "All required files are present."

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name student-result-ml-container \
            -p 5000:5000 \
            student-result-ml:${{ github.sha }}

      # Controlled failure: intentionally use the wrong port.
      - name: Wait for application to become ready
        run: |
          set -e
          for i in $(seq 1 15); do
            if curl --fail --silent http://localhost:5001/; then
              echo
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs student-result-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          set -e
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f student-result-ml-container || true
