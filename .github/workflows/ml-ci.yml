
name: Student Result ML CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Verify required application files
        run: |
          set -e
          test -f app.py
          test -f student_result_model.pkl
          test -f metrics.json
          test -f requirements.txt
          test -f Dockerfile
          test -f .dockerignore
          test -f test_app.py
          echo "All required files are present."

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      # Practical-7 Step 4: Build Docker image
      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .
